name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Goldens are excluded on CI: the runner's SDK lacks the material_fonts
      # cache the golden harness loads Roboto from, and cross-OS font
      # rasterization makes Windows-generated PNGs fail pixel comparison on
      # Linux anyway. They are run/regenerated locally — see dart_test.yaml.
      - run: flutter test --exclude-tags=golden

  integration-android:
    runs-on: ubuntu-latest
    # Historically marginal at 30: emulator boot alone has taken 7+ minutes on
    # these runners, plus ~6 min of Gradle and an 80+ s install.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Without this the emulator runs UNACCELERATED on GitHub-hosted runners:
      # 7+ minute boots, PackageManager NPEs during adb install, and chronic
      # 30-minute timeouts. This is the setup step documented by
      # reactivecircus/android-emulator-runner for Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_smoke_test.dart
